# The Dockerfile starts FROM the published linXiv-web image (pinned by
# UPSTREAM_VERSION), so BUILD_FROM is unused. These values only satisfy the HA
# builder and pr-check.yaml, which require a build_from entry per arch.
build_from:
  amd64: ghcr.io/toledoem/linxiv-web:0.1.2
  aarch64: ghcr.io/toledoem/linxiv-web:0.1.2
labels:
  org.opencontainers.image.title: linXiv-web
  org.opencontainers.image.source: https://github.com/ToledoEM/HA-addon-linXiv-web
