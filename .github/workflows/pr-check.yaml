name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-changelog:
    name: Check CHANGELOG.md updated
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require CHANGELOG entry when config.yaml changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" "${{ github.sha }}")
          if echo "$changed" | grep -qx 'linxiv_web/config.yaml' \
            && ! echo "$changed" | grep -qx 'linxiv_web/CHANGELOG.md'; then
            echo "::error::No new entry in linxiv_web/CHANGELOG.md!"
            exit 1
          fi

  addon-linter:
    name: Addon lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./linxiv_web"

  check-build:
    name: Test build
    runs-on: ${{ matrix.runner }}
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build_from
        id: information
        run: |
          build_from=$(yq -r '.build_from["${{ matrix.arch }}"] // ""' linxiv_web/build.yaml)
          if [[ -z "$build_from" || "$build_from" == "null" ]]; then
            echo "::error::No build_from entry for arch '${{ matrix.arch }}' in linxiv_web/build.yaml"
            exit 1
          fi
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build addon (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: linxiv_web
          file: linxiv_web/Dockerfile
          push: false
          provenance: false
          sbom: false
          tags: local/linxiv_web-${{ matrix.arch }}:test
          build-args: |
            BUILD_FROM=${{ steps.information.outputs.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
